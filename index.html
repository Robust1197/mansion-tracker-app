<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>东京マンション追踪器</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f6f8}
    *{box-sizing:border-box} body{margin:0}.wrap{max-width:980px;margin:auto;padding:16px 14px 80px}
    header{position:sticky;top:0;z-index:5;background:rgba(245,246,248,.94);backdrop-filter:blur(12px);padding:12px 0}
    h1{font-size:21px;margin:0 0 5px}.sub{font-size:12px;color:#6b7280}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:white;border-radius:14px;padding:12px;box-shadow:0 1px 2px #0000000d}.stat b{font-size:22px}.stat span{display:block;font-size:11px;color:#6b7280;margin-top:3px}
    .toolbar{display:flex;gap:8px;overflow:auto;padding:4px 0 10px}.chip,.select{border:0;background:white;border-radius:999px;padding:9px 12px;font-size:13px;white-space:nowrap;box-shadow:0 1px 2px #0000000d}.chip.active{background:#111827;color:#fff}.select{border-radius:10px}
    .card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #00000012}.top{display:flex;gap:8px;align-items:flex-start}.title{font-weight:700;line-height:1.45;flex:1}.fav{border:0;background:#f3f4f6;width:40px;height:40px;border-radius:12px;font-size:22px}.fav.on{background:#fff1f2;color:#e11d48}
    .meta{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0}.badge{font-size:12px;padding:5px 7px;border-radius:8px;background:#f3f4f6}.down{background:#ecfdf5;color:#047857}.up{background:#fff1f2;color:#be123c}.danchi{background:#eff6ff;color:#1d4ed8}.source{color:#6b7280}
    .price{font-size:24px;font-weight:800}.ppm{font-size:12px;color:#6b7280;margin-left:5px}.actions{display:flex;gap:8px;margin-top:10px}.btn{flex:1;border:0;border-radius:11px;padding:10px 12px;background:#111827;color:white;text-decoration:none;text-align:center;font-weight:600;font-size:13px}.btn.secondary{background:#eef2f7;color:#111827}
    .history{display:none;margin-top:12px;padding-top:10px;border-top:1px solid #eee}.history.show{display:block}.history-row{font-size:12px;color:#4b5563;margin:4px 0}.spark{height:70px;width:100%;margin-top:8px}
    .empty{text-align:center;color:#6b7280;padding:50px 10px}.notice{background:#fff7ed;color:#9a3412;border-radius:12px;padding:10px;font-size:12px;margin:8px 0;display:none}.notice.show{display:block}
    @media(min-width:700px){.list{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{margin:0}.stats{grid-template-columns:repeat(5,1fr)}}
  </style>
</head>
<body>
<div class="wrap">
<header>
  <h1>东京マンション追踪器</h1>
  <div id="updated" class="sub">正在读取最新房源…</div>
  <div id="notice" class="notice"></div>
  <div class="stats">
    <div class="stat"><b id="nCurrent">-</b><span>当前符合条件</span></div>
    <div class="stat"><b id="nFav">0</b><span>我的关注</span></div>
    <div class="stat"><b id="nDown">-</b><span>发生降价</span></div>
  </div>
  <div class="toolbar">
    <button class="chip active" data-filter="current">当前候选</button>
    <button class="chip" data-filter="fav">♡ 我的关注</button>
    <button class="chip" data-filter="danchi">有电梯団地</button>
    <button class="chip" data-filter="down">降价房源</button>
    <button class="chip" data-filter="all">历史全部</button>
    <select id="sort" class="select">
      <option value="new">最近更新</option>
      <option value="price">价格从低到高</option>
      <option value="ppm">㎡单价从低到高</option>
      <option value="walk">离车站更近</option>
    </select>
  </div>
</header>
<div id="list" class="list"></div>
<div id="empty" class="empty" style="display:none">没有符合这个筛选的房源。</div>
</div>
<script src="app.js"></script>
</body>
</html>
