name: Build XHS Login Helper APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-xhs-login/**"
      - ".github/workflows/build-xhs-login-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p android-xhs-login assembleDebug

      - name: Prepare APK
        run: cp android-xhs-login/app/build/outputs/apk/debug/app-debug.apk xhs-login-helper.apk

      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xhs-login-helper
          name: Xiaohongshu Login Helper
          body: |
            Android helper for refreshing the Xiaohongshu login cookie used by Tokyo Mansion Tracker.
          files: xhs-login-helper.apk
          make_latest: true
